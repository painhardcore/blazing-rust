<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" class="scoreboard" width="720" height="285" role="img" aria-label="Checks passed with and without the skill: Opus 82% to 100%, Sonnet 76% to 96%, Haiku 79% to 97%">
<style>
