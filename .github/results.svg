  .scoreboard .bases { stroke: #9198a1; }
  .scoreboard .grid { stroke: #30363d; stroke-width: 1; }
  .scoreboard .ring { stroke: #0d1117; stroke-width: 2; }
  .scoreboard .b { font-weight: 700; }
